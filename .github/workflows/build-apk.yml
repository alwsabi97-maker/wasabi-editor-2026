name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download project
        run: |
          curl -L --fail --retry 3 \
          "https://raw.githubusercontent.com/alwsabi97-maker/wasabi-editor-2026/main/%D9%85%D8%AD%D8%B1%D8%B1_%D8%A7%D9%84%D9%88%D8%B5%D8%A7%D8%A8%D9%8A_%D8%A7%D9%84%D8%B4%D8%A7%D9%85%D9%84_Android_v4.2-2.zip" \
          -o app.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -o app.zip -d project

      - name: Find project
        run: |
          find project -type f -name gradlew -print -quit > /tmp/gradlew_path

          if [ -s /tmp/gradlew_path ]; then
            GRADLEW=$(cat /tmp/gradlew_path)
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit > /tmp/settings_path

            if [ ! -s /tmp/settings_path ]; then
              echo "Android Gradle project not found"
              exit 1
            fi

            SETTINGS=$(cat /tmp/settings_path)
            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -exec cp {} output/ \;

          ls -lah output

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/app-debug.apk \
            --title "محرر الوصابي الشامل APK #${GITHUB_RUN_NUMBER}" \
            --notes "نسخة APK تم بناؤها بواسطة GitHub Actions"
      - name: Diagnose APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r output/app-debug.apk
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
            PACKAGE=$($AAPT dump badging output/app-debug.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            echo "PACKAGE=$PACKAGE"
            adb shell monkey -p "$PACKAGE" 1
            sleep 8
            adb logcat -d > logcat.txt
            grep -iE "FATAL EXCEPTION|AndroidRuntime|Caused by:" logcat.txt | tail -100 || true

      - name: Upload Crash Log
        uses: actions/upload-artifact@v4
        with:
          name: crash-log
          path: logcat.txt

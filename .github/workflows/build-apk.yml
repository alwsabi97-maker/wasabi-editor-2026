name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download project
        run: |
          curl -L --fail --retry 3 \
          "https://raw.githubusercontent.com/alwsabi97-maker/wasabi-editor-2026/main/%D9%85%D8%AD%D8%B1%D8%B1_%D8%A7%D9%84%D9%88%D8%B5%D8%A7%D8%A8%D9%8A_%D8%A7%D9%84%D8%B4%D8%A7%D9%85%D9%84_Android_v4.2-2.zip" \
          -o app.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -o app.zip -d project

      - name: Find project
        run: |
          GRADLEW=$(find project -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "gradlew found: $GRADLEW"
          else
            SETTINGS=$(find project -type

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download project
        run: |
          curl -L --fail --retry 3 \
          "https://raw.githubusercontent.com/alwsabi97-maker/wasabi-editor-2026/main/%D9%85%D8%AD%D8%B1%D8%B1_%D8%A7%D9%84%D9%88%D8%B5%D8%A7%D8%A8%D9%8A_%D8%A7%D9%84%D8%B4%D8%A7%D9%85%D9%84_Android_v4.2-2.zip" \
          -o app.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -o app.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -exec cp {} output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: محرر-الوصابي-الشامل-APK
          path: output/*.apk

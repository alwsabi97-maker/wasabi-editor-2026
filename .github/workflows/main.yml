name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o *.zip -d project

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"
          
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-apk
          path: "**/build/outputs/apk/**/*.apk"
          

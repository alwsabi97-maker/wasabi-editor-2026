name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Gradle
        run: |
          mkdir project
          unzip -o \*.zip -d project || unzip -o "*.zip" -d project
          cd project
          # Find directory containing build.gradle or settings.gradle
          TARGET_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
          else
            cd $(ls -d */ | head -n 1)
          fi
          
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wasabi-apk
          path: "**/build/outputs/apk/**/*.apk"
          
